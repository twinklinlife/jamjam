  { id: 'arm_iron',    name: 'Iron Guard',   rarity: 'blue',   price: 350, hp: 0,  def: 0.25 },
  { id: 'arm_plate',   name: 'Plate Armor',  rarity: 'purple', price: 700, hp: 60, def: 0.35 },
];

function weaponById(id) { return WEAPONS.find(w => w.id === id) || WEAPONS[0]; }
function armorById(id) { return ARMORS.find(a => a.id === id) || ARMORS[0]; }

// Only 2 stages now (60-second play-length target) — every stage is a
// named boss, so a hand-tuned table replaces the old 10-stage formulas.
// reload/aimError/gold/scoreBonus reuse the original stage-5/stage-10
// values (already felt right for a boss fight) and are what the boss
// "awakens" into; HP is deliberately cut since the old numbers assumed 4
// prior stages of gear grinding that no longer happen before the player
// meets these bosses. easyReload/easyAimError are the softer opening-phase
// values the boss uses for the first AWAKEN_AT_MS of the fight. At that
// point it enters a AWAKEN_CUTSCENE_MS-long "awakening" beat (visual only,
// boss holds fire — the player can keep shooting for free hits) before
// snapping to the tuned reload/aimError above and resuming fire.
const AWAKEN_AT_MS = 15000;
const AWAKEN_CUTSCENE_MS = 3000;
// scaleMult now sizes the boss's illustrated sprite (preserves the
// established Lim-taller/Woo-shorter relationship from the reference art).
const BOSSES = [
  { name: 'The Conqueror LIM', key: 'lim', hp: 120, reload: 1600, aimError: 9, easyReload: 2600, easyAimError: 18, gold: 270, scoreBonus: 800, scaleMult: 1.15 },
  { name: 'Dark Lord WOO', key: 'woo', hp: 180, reload: 1200, aimError: 4, easyReload: 2000, easyAimError: 12, gold: 420, scoreBonus: 1300, scaleMult: 0.9 },
];
function bossFor(stage) { return BOSSES[Math.min(Math.max(stage - 1, 0), BOSSES.length - 1)]; }

function computePlayerStats(save) {
  const w = weaponById(save.equippedWeapon);
  const a = armorById(save.equippedArmor);
  const atk = 1 + w.atk;
  const atkspd = Math.max(-0.5, w.atkspd);
  const maxHp = 100 + a.hp;
  const def = Math.min(0.6, a.def);
  const reload = Math.max(250, 1000 * (1 - atkspd));
  return { atk, atkspd, maxHp, def, reload, weapon: w, armor: a };
}

/* ---------- Save / persistence ---------- */
const SAVE_KEY = 'ragdollArcherQuest_v1';

function defaultSave() {
  return {
    gold: 0,
    ownedWeapons: ['bow_worn'],
    ownedArmors: ['arm_cloth'],
    equippedWeapon: 'bow_worn',
    equippedArmor: 'arm_cloth',
    bestScore: 0,
    bestStage: 0,
    nickname: 'Archer' + Math.floor(1000 + Math.random() * 9000),
    runActive: false,
    currentStage: 1,
    runScore: 0,
    clearedStages: 0,
    leaderboard: [],
  };
}

function loadSave() {
  try {
    const raw = localStorage.getItem(SAVE_KEY);
    if (!raw) return defaultSave();
    const parsed = JSON.parse(raw);
    return Object.assign(defaultSave(), parsed);
  } catch (e) {
    console.warn('save load failed, using defaults', e);
    return defaultSave();
  }
}

function persistSave() {
  try {
    localStorage.setItem(SAVE_KEY, JSON.stringify(SAVE));
  } catch (e) {
    console.warn('save persist failed', e);
  }
}

let SAVE = loadSave();

function addLeaderboardEntry(clearedStages, runScore) {
  const combined = clearedStages * 100000 + runScore;
  SAVE.leaderboard.push({
    name: SAVE.nickname,
    stage: clearedStages,
    score: runScore,
    combined,
    date: new Date().toLocaleDateString(),
  });
  SAVE.leaderboard.sort((a, b) => b.combined - a.combined);
  SAVE.leaderboard = SAVE.leaderboard.slice(0, 10);
  if (combined > (SAVE.bestScore * 0 + (SAVE.bestStage * 100000 + SAVE.bestScore))) {
    // best tracked via bestStage/bestScore combined comparison
  }
  if (clearedStages > SAVE.bestStage || (clearedStages === SAVE.bestStage && runScore > SAVE.bestScore)) {
    SAVE.bestStage = clearedStages;
    SAVE.bestScore = runScore;
  }
  persistSave();
  return combined;
}

/* ---------- Small UI helpers ---------- */
function makeButton(scene, x, y, w, h, label, opts) {
  opts = opts || {};
  const bgColor = opts.bg !== undefined ? opts.bg : 0x2d6cdf;
  const fontSize = opts.fontSize || 22;
  const rect = scene.add.rectangle(x, y, w, h, bgColor, 1).setStrokeStyle(2, 0xffffff, 0.25);
  const text = scene.add.text(x, y, label, {
    // buttons keep the regular font — "Press Start 2P" is wide enough per
    // character to risk overflowing these fixed-width buttons
    fontFamily: 'Arial, sans-serif', fontSize: fontSize + 'px', color: '#ffffff', fontStyle: 'bold',
  }).setOrigin(0.5);
  const enabledState = { enabled: opts.enabled !== false };
  function refreshVisual() {
    rect.setFillStyle(enabledState.enabled ? bgColor : 0x555555, 1);
    rect.setAlpha(enabledState.enabled ? 1 : 0.6);
    text.setAlpha(enabledState.enabled ? 1 : 0.6);
  }
  refreshVisual();
  rect.setInteractive({ useHandCursor: true });
  rect.on('pointerover', () => { if (enabledState.enabled) rect.setFillStyle(bgColor, 0.8); });
  rect.on('pointerout', () => refreshVisual());
  rect.on('pointerdown', () => {
    if (!enabledState.enabled) return;
    if (opts.onClick) opts.onClick();
  });
  return {
    rect, text,
    setEnabled(v) { enabledState.enabled = v; refreshVisual(); },
    setLabel(v) { text.setText(v); },
    destroy() { rect.destroy(); text.destroy(); },
  };
}

/* ---------- Nickname entry ----------
   Shown once per run, right before the run's outcome is committed to the
   leaderboard. Uses a Phaser DOM Element for the actual <input> so it

   (requires config.dom.createContainer). */
function promptNickname(scene, onConfirm) {
  const panelW = 460, panelH = 220;

  }).setOrigin(0.5).setDepth(depth);
  const sub = scene.add.text(W / 2, H / 2 - panelH / 2 + 62, '리더보드에 표시될 이름입니다 (최대 12자)', {
    fontFamily: 'Arial, sans-serif', fontSize: '14px', color: '#a9b2c0',
  }).setOrigin(0.5).setDepth(depth);

  const inputEl = document.createElement('input');
  inputEl.type = 'text';
  inputEl.maxLength = 12;
  inputEl.value = SAVE.nickname;
  inputEl.style.cssText = 'width:280px;padding:10px 12px;font-size:20px;font-family:Arial,sans-serif;'
    + 'text-align:center;border-radius:6px;border:2px solid #33404f;background:#0e1218;color:#f2f2f2;outline:none;';
  const dom = scene.add.dom(W / 2, H / 2 - 4, inputEl).setDepth(depth);

  const confirmBtn = makeButton(scene, W / 2, H / 2 + panelH / 2 - 36, 200, 48, '확인', {
    bg: 0x2d6cdf,

  });
  confirmBtn.rect.setDepth(depth);

  function confirm() {

    SAVE.nickname = raw.length > 0 ? raw.slice(0, 12) : SAVE.nickname;

    onConfirm();

  inputEl.focus();

function fmt(n) { return Math.round(n).toLocaleString(); }

const CAT = { GROUND: 0x0001, PLAYER_PART: 0x0002, ENEMY_PART: 0x0004, PLAYER_ARROW: 0x0008, ENEMY_ARROW: 0x0010 };
const CHAR_HEIGHT = 175; // display height in px for scaleMult=1

/* ---------- Hit zones ----------
   Part-based damage (head=40/torso=20/limb=10) needs separate hitboxes,
   but characters are now single illustrated sprites, not physics limbs.
   These are static Matter sensor bodies positioned as fractions of the
   character's display height — created via matter.add.circle/rectangle
   directly, so they're raw Matter bodies (no Phaser GameObject wrapper).
   partType/side are plain custom properties since raw bodies have no
   setData(). Fractions are first-pass estimates tuned visually. */
function createHitZones(scene, x, feetY, side, displayHeight) {
  const isPlayer = side === 'player';
  const partCat = isPlayer ? CAT.PLAYER_PART : CAT.ENEMY_PART;
  const collidesWithArrow = isPlayer ? CAT.ENEMY_ARROW : CAT.PLAYER_ARROW;
  const H = displayHeight;

  function mkZone(cy, w, h, isCircle, partType) {
    const body = isCircle
      ? scene.matter.add.circle(x, cy, w, { isStatic: true, isSensor: true })
      : scene.matter.add.rectangle(x, cy, w, h, { isStatic: true, isSensor: true });
    body.collisionFilter.category = partCat;
    body.collisionFilter.mask = collidesWithArrow;
    body.partType = partType;
    body.side = side;
    return body;
  }

  return {
    head: mkZone(feetY - H * 0.87, H * 0.12, 0, true, 'head'),
    torso: mkZone(feetY - H * 0.55, H * 0.42, H * 0.28, false, 'torso'),
    arms: mkZone(feetY - H * 0.62, H * 0.80, H * 0.16, false, 'limb'),
    legs: mkZone(feetY - H * 0.22, H * 0.42, H * 0.40, false, 'limb'),
  };
}
function destroyHitZones(scene, zones) {
  Object.values(zones).forEach(b => scene.matter.world.remove(b));
}

/* ---------- Sprite character (pose-swap) ----------
   Replaces the old physics ragdoll: a single Image that swaps between a
   handful of pre-drawn poses (idle/attack/hit/defeat) rather than
   simulating limbs. side: 'player' | 'enemy'. */
function createSpriteCharacter(scene, x, feetY, side, textureKeys, displayHeight) {
  const img = scene.add.image(x, feetY, textureKeys.idle).setOrigin(0.5, 1);
  img.setScale(displayHeight / img.height);
  if (side === 'player') img.setFlipX(true); // source art faces left; player stands left and shoots right

  let currentIdleKey = textureKeys.idle;
  let revertTimer = null;

  function setTexture(key) {
    img.setTexture(key);
    img.setScale(displayHeight / img.height);
  }

  return {
    img, x, feetY, side, dead: false,
    flashPose(poseName, durationMs) {
      if (this.dead) return;
      setTexture(textureKeys[poseName] || poseName);
      if (revertTimer) { revertTimer.remove(); revertTimer = null; }
      revertTimer = scene.time.delayedCall(durationMs, () => { if (!this.dead) setTexture(currentIdleKey); });
    },
    setDrawing(isDrawing) {
      if (this.dead) return;
      setTexture(isDrawing ? textureKeys.attack : currentIdleKey);
    },
    setIdleTexture(key) {
      currentIdleKey = key;
      if (!revertTimer) setTexture(key);
    },
    setPoseTexture(poseName, key) {
      // repoints a named pose (e.g. 'attack') at a different texture key —
      // used so a boss's attack pose shows its awakened outfit once
      // transformed, instead of always the pre-awaken outfit's bow-draw art
      textureKeys[poseName] = key;
    },
    flashWhite() {
      if (this.dead || !img.active) return;
      img.setTintFill(0xffffff);
      scene.time.delayedCall(80, () => { if (img.active) img.clearTint(); });
    },
    showDefeat() {
      this.dead = true;
      if (revertTimer) { revertTimer.remove(); revertTimer = null; }
      setTexture(textureKeys.defeat);
    },
    destroy() { img.destroy(); },
  };
}

/* ================= GAME SCENE ================= */
class GameScene extends Phaser.Scene {
  constructor() { super('GameScene'); }

  init(data) { this.stage = data.stage || 1; }

  create() {
    this.matter.world.setBounds(0, 0, W, H + 200);
    this.matter.world.engine.gravity.y = 1;

    // Pixel-art arena background: calm office pre-awaken, dramatic boss
    // arena once the boss awakens (see awakenBoss()).
    this.bg = this.add.image(0, 0, 'bg_office').setOrigin(0);
    this.bg.setDisplaySize(W, H);
    // dark strip behind the top HUD so its light-colored text/bars stay
    // readable against the background art
    this.add.rectangle(0, 0, W, 112, 0x000000, 0.28).setOrigin(0);

    // ground
    const ground = this.matter.add.rectangle(W / 2, GROUND_Y + 40, W, 80, { isStatic: true });
    ground.collisionFilter.category = CAT.GROUND;
    ground.collisionFilter.mask = 0xffff;
    // semi-transparent so the background art's own floor still reads
    // through; recolored to match the arena when the boss awakens
    this.groundVisual = this.add.rectangle(W / 2, GROUND_Y + 20, W, 40, 0x8fa05c, 0.45).setOrigin(0.5);

    this.stats = computePlayerStats(SAVE);
    this.playerHP = this.stats.maxHp;
    this.playerMaxHP = this.stats.maxHp;

    const boss = bossFor(this.stage);
    this.bossData = boss;
    this.enemyMaxHP = boss.hp;
    this.enemyHP = this.enemyMaxHP;
    // Boss opens in an easier phase and "awakens" into the tuned numbers
    // above after AWAKEN_AT_MS — see update() / awakenBoss().
    this.enemyReload = boss.easyReload;
    this.enemyAimError = boss.easyAimError;
    this.awakened = false;
    this.awakening = false;
    this.stageStartTime = this.time.now;

    this.player = createSpriteCharacter(this, PLAYER_X, GROUND_Y, 'player', {
      idle: 'player_idle', attack: 'player_attack', hit: 'player_hit', defeat: 'player_defeat',
    }, CHAR_HEIGHT);
    this.player.zones = createHitZones(this, PLAYER_X, GROUND_Y, 'player', CHAR_HEIGHT);

    const enemyHeight = CHAR_HEIGHT * boss.scaleMult;
    this.enemy = createSpriteCharacter(this, ENEMY_X, GROUND_Y, 'enemy', {
      idle: boss.key + '_outfit1', attack: boss.key + '_attack', hit: boss.key + '_hit', defeat: boss.key + '_defeat',
    }, enemyHeight);
    this.enemy.zones = createHitZones(this, ENEMY_X, GROUND_Y, 'enemy', enemyHeight);

    this.arrows = [];
    this.dots = [];
    for (let i = 0; i < 14; i++) {
      // dark outline circle underneath + bright gold fill on top, so the
      // trajectory reads clearly against both the light office background
      // and the darker boss-arena background
      const dOutline = this.add.circle(0, 0, 6, 0x2b1d0f, 0.55).setVisible(false);
      const d = this.add.circle(0, 0, 4, 0xffd166, 0.95).setVisible(false);
      this.dots.push({ outline: dOutline, dot: d });
    }
    // drag/pull-back line: dark outline line + bright gold line on top for
    // strong contrast against any background
    this.aimLineOutline = this.add.line(0, 0, 0, 0, 0, 0, 0x2b1d0f, 0.6).setLineWidth(7).setVisible(false);
    this.aimLine = this.add.line(0, 0, 0, 0, 0, 0, 0xffd166, 1).setLineWidth(3).setVisible(false);

    this.state = 'AIMING';
    this.isDragging = false;
    this.lastShotTime = -99999;
    this.lastEnemyShotTime = this.time.now;

    this.buildHud(boss);

    this.input.on('pointerdown', (p, currentlyOver) => {
      if (currentlyOver.length > 0) return; // tapped a UI button, not the aim area
      if (this.state !== 'AIMING') return;
      if (!this.canFire()) return;
      this.isDragging = true;
      this.player.setDrawing(true);
      this.updateAimVisual(p.x, p.y);
    });
    this.input.on('pointermove', (p) => {
      if (!this.isDragging) return;
      this.updateAimVisual(p.x, p.y);
    });
    this.input.on('pointerup', (p) => {
      if (!this.isDragging) return;
      this.isDragging = false;
      this.player.setDrawing(false);
      this.releaseShot(p.x, p.y);
      this.hideAimVisual();
    });

    this.matter.world.on('collisionstart', (event) => this.onCollision(event));

    this.redFlash = this.add.rectangle(0, 0, W, H, 0xff0000, 0).setOrigin(0);
  }

  buildHud(boss) {
    const margin = 24;
    // regular font for the HUD — these labels sit directly above fixed-
    // width HP bars, and pixel-font glyphs are wide enough to overhang them
    this.hudStage = this.add.text(W / 2, margin, `STAGE ${this.stage} — ${boss.name}`, {
      fontFamily: 'Arial, sans-serif', fontSize: '24px', color: '#ffd166', fontStyle: 'bold',
    }).setOrigin(0.5, 0);

    this.hudScore = this.add.text(margin, margin, `SCORE ${fmt(SAVE.runScore)}   GOLD ${fmt(SAVE.gold)}`, {
      fontFamily: 'Arial, sans-serif', fontSize: '18px', color: '#9fd2ff',
    }).setOrigin(0, 0);

    // HP bars
    this.playerHpBarBg = this.add.rectangle(margin, 64, 260, 20, 0x33393f).setOrigin(0, 0.5);
    this.playerHpBar = this.add.rectangle(margin, 64, 260, 20, 0x4caf50).setOrigin(0, 0.5);
    this.add.text(margin, 44, 'PLAYER', { fontFamily: 'Arial, sans-serif', fontSize: '14px', color: '#c8d3e0' });

    this.enemyHpBarBg = this.add.rectangle(W - margin, 64, 260, 20, 0x33393f).setOrigin(1, 0.5);
    this.enemyHpBar = this.add.rectangle(W - margin, 64, 260, 20, 0xd9534f).setOrigin(1, 0.5);
    this.add.text(W - margin, 44, boss.name.toUpperCase(), { fontFamily: 'Arial, sans-serif', fontSize: '14px', color: '#c8d3e0' }).setOrigin(1, 0);

    this.reloadBarBg = this.add.rectangle(margin, 92, 160, 10, 0x33393f).setOrigin(0, 0.5);
    this.reloadBar = this.add.rectangle(margin, 92, 160, 10, 0xffd166).setOrigin(0, 0.5);
  }

  canFire() { return this.time.now - this.lastShotTime >= this.stats.reload; }

  updateAimVisual(px, py) {
    let dx = SHOT_ORIGIN.x - px, dy = SHOT_ORIGIN.y - py;
    const len = Math.hypot(dx, dy);
    const clampedLen = Math.min(len, MAX_DRAG);
    if (len > 0) { dx = dx / len * clampedLen; dy = dy / len * clampedLen; }
    const handX = SHOT_ORIGIN.x - dx, handY = SHOT_ORIGIN.y - dy;
    this.aimLineOutline.setTo(SHOT_ORIGIN.x, SHOT_ORIGIN.y, handX, handY).setVisible(true);
    this.aimLine.setTo(SHOT_ORIGIN.x, SHOT_ORIGIN.y, handX, handY).setVisible(true);

    const vx = dx / MAX_DRAG * VELOCITY_SCALE * MAX_DRAG;
    const vy = dy / MAX_DRAG * VELOCITY_SCALE * MAX_DRAG;
    this.drawTrajectory(vx, vy);
  }

  drawTrajectory(vx, vy) {
    const steps = this.dots.length;
    for (let i = 0; i < steps; i++) {
      const t = (i + 1) * 0.06;
      const x = SHOT_ORIGIN.x + vx * t;
      const y = SHOT_ORIGIN.y + vy * t + 0.5 * GRAVITY_PX * t * t;
      const { outline, dot } = this.dots[i];
      if (y > GROUND_Y + 30 || x > W || x < 0) { outline.setVisible(false); dot.setVisible(false); continue; }
      outline.setPosition(x, y).setVisible(true);
      dot.setPosition(x, y).setVisible(true);
    }
  }

  hideAimVisual() {
    this.aimLineOutline.setVisible(false);
    this.aimLine.setVisible(false);
    this.dots.forEach(({ outline, dot }) => { outline.setVisible(false); dot.setVisible(false); });
  }

  releaseShot(px, py) {
    let dx = SHOT_ORIGIN.x - px, dy = SHOT_ORIGIN.y - py;
    const len = Math.hypot(dx, dy);
    if (len < MIN_DRAG) return; // cancelled, too short
    const clampedLen = Math.min(len, MAX_DRAG);
    dx = dx / len * clampedLen; dy = dy / len * clampedLen;
    const vx = dx / MAX_DRAG * VELOCITY_SCALE * MAX_DRAG;
    const vy = dy / MAX_DRAG * VELOCITY_SCALE * MAX_DRAG;
    this.spawnArrow(SHOT_ORIGIN.x, SHOT_ORIGIN.y, vx, vy, 'player');
    this.lastShotTime = this.time.now;
  }

  spawnArrow(x, y, vx, vy, owner) {
    const arrow = this.add.rectangle(x, y, 20, 3, owner === 'player' ? 0xf2e6c9 : 0xff8080);
    this.matter.add.gameObject(arrow, { shape: { type: 'rectangle', width: 20, height: 3 }, frictionAir: 0, friction: 0, restitution: 0.1 });
    arrow.body.inertia = Infinity;
    arrow.body.inverseInertia = 0;
    arrow.setCollisionCategory(owner === 'player' ? CAT.PLAYER_ARROW : CAT.ENEMY_ARROW);
    arrow.setCollidesWith([CAT.GROUND, owner === 'player' ? CAT.ENEMY_PART : CAT.PLAYER_PART]);
    arrow.setVelocity(vx / STEP_HZ, vy / STEP_HZ);
    arrow.setData('owner', owner);
    arrow.rotation = Math.atan2(vy, vx);
    arrow.setData('spawnTime', this.time.now);
    this.arrows.push(arrow);
    return arrow;
  }

  onCollision(event) {
    for (const pair of event.pairs) {
      const bodyA = pair.bodyA, bodyB = pair.bodyB;
      const a = bodyA.gameObject, b = bodyB.gameObject;
      // the arrow is always Phaser-gameObject-backed (has getData); the hit
      // zone it hits is a raw Matter body (partType/side as plain props)
      let arrowObj = null, zoneBody = null;
      if (a && a.getData && a.getData('owner') !== undefined) { arrowObj = a; zoneBody = bodyB; }
      else if (b && b.getData && b.getData('owner') !== undefined) { arrowObj = b; zoneBody = bodyA; }
      if (!arrowObj || !zoneBody || !zoneBody.partType) continue; // hit ground or something else
      const owner = arrowObj.getData('owner');
      const side = zoneBody.side;
      if (owner === 'player' && side === 'enemy') this.handleHit(arrowObj, zoneBody, zoneBody.partType, 'enemy');
      else if (owner === 'enemy' && side === 'player') this.handleHit(arrowObj, zoneBody, zoneBody.partType, 'player');
    }
  }

  handleHit(arrow, zoneBody, partType, targetSide) {
    if (!arrow.active) return;
    const contact = { x: zoneBody.position.x, y: zoneBody.position.y };
    this.impactFlash(contact.x, contact.y);
    this.destroyArrow(arrow);

    if (targetSide === 'enemy') {
      const dmg = Math.round(DAMAGE_BASE[partType] * this.stats.atk);
      this.enemyHP = Math.max(0, this.enemyHP - dmg);
      SAVE.runScore += dmg;
      this.hudScore.setText(`SCORE ${fmt(SAVE.runScore)}   GOLD ${fmt(SAVE.gold)}`);
      this.enemyHpBar.width = 260 * (this.enemyHP / this.enemyMaxHP);
      this.enemy.flashPose('hit', 350);
      this.enemy.flashWhite();
      this.popupScore(contact.x, contact.y - 20, partType.toUpperCase() + ' ' + dmg, partType === 'head' ? '#ffd166' : '#ffffff');
      this.cameras.main.shake(partType === 'head' ? 140 : 80, partType === 'head' ? 0.008 : 0.004);
      if (this.enemyHP <= 0 && this.state === 'AIMING') this.onEnemyDefeated();
    } else {
      const dmgRaw = Phaser.Math.Between(8, 14);
      const dmg = Math.round(dmgRaw * (1 - this.stats.def));
      this.playerHP = Math.max(0, this.playerHP - dmg);
      this.playerHpBar.width = 260 * (this.playerHP / this.playerMaxHP);
      this.player.flashPose('hit', 350);
      this.player.flashWhite();
      this.flashRed();
      this.cameras.main.shake(100, 0.006);
      if (this.playerHP <= 0 && this.state === 'AIMING') this.onPlayerDefeated();
    }
  }

  impactFlash(x, y) {
    const c = this.add.circle(x, y, 6, 0xffffff, 0.9);
    this.tweens.add({ targets: c, radius: 22, alpha: 0, duration: 260, onComplete: () => c.destroy() });
  }

  popupScore(x, y, text, color) {
    const t = this.add.text(x, y, text, { fontFamily: PIXEL_FONT, fontSize: '18px', color, fontStyle: 'bold' }).setOrigin(0.5);
    this.tweens.add({ targets: t, y: y - 40, alpha: 0, duration: 700, onComplete: () => t.destroy() });
  }

  flashRed() {
    this.redFlash.setAlpha(0.35);
    this.tweens.add({ targets: this.redFlash, alpha: 0, duration: 250 });
  }

  destroyArrow(arrow) {
    arrow.active = false;
    const idx = this.arrows.indexOf(arrow);
    if (idx >= 0) this.arrows.splice(idx, 1);
    arrow.destroy();
  }

  onEnemyDefeated() {
    this.state = 'CLEAR';
    this.enemy.showDefeat();
    const boss = bossFor(this.stage);
    const gold = boss.gold;
    SAVE.gold += gold;
    SAVE.runScore += boss.scoreBonus;
    SAVE.clearedStages = Math.max(SAVE.clearedStages, this.stage);
    SAVE.currentStage = this.stage + 1;
    SAVE.runActive = true;
    persistSave();

    this.add.text(W / 2, H / 2 - 60, `${boss.name.toUpperCase()} DEFEATED!`, {
      fontFamily: PIXEL_FONT, fontSize: '42px', color: '#ffd166', fontStyle: 'bold',
    }).setOrigin(0.5);
    this.add.text(W / 2, H / 2, `+${gold} GOLD`, {
      fontFamily: PIXEL_FONT, fontSize: '22px', color: '#9fd2ff',
    }).setOrigin(0.5);

    this.time.delayedCall(1400, () => {
      if (this.stage >= STAGE_MAX) {
        promptNickname(this, () => {
          const combined = addLeaderboardEntry(SAVE.clearedStages, SAVE.runScore);
          SAVE.runActive = false;
          persistSave();
          this.scene.start('ResultScene', { win: true, combined });
        });
      } else {
        this.scene.start('ShopScene', { comingStage: this.stage + 1 });
      }
    });
  }

  onPlayerDefeated() {
    this.state = 'DEAD';
    this.player.showDefeat();

    this.add.text(W / 2, H / 2 - 20, 'DEFEATED', {
      fontFamily: PIXEL_FONT, fontSize: '48px', color: '#ff6b6b', fontStyle: 'bold',
    }).setOrigin(0.5);

    this.time.delayedCall(1400, () => {
      promptNickname(this, () => {
        const combined = addLeaderboardEntry(SAVE.clearedStages, SAVE.runScore);
        SAVE.runActive = false;
        persistSave();
        this.scene.start('ResultScene', { win: false, combined });
      });
    });
  }

  update(time, delta) {
    // reload gauge
    const readiness = Phaser.Math.Clamp((time - this.lastShotTime) / this.stats.reload, 0, 1);
    this.reloadBar.width = 160 * readiness;
    this.reloadBar.setFillStyle(readiness >= 1 ? 0x4caf50 : 0xffd166);

    // boss awakening: opens on the easier phase, then snaps to full strength
    if (!this.awakened && this.state === 'AIMING' && time - this.stageStartTime >= AWAKEN_AT_MS) {
      this.awakenBoss();
    }

    // enemy auto-fire (held off during the awakening cutscene — the boss is
    // powering up and doesn't shoot, so the player gets free hits in)
    if (this.state === 'AIMING' && !this.awakening && time - this.lastEnemyShotTime >= this.enemyReload) {
      this.lastEnemyShotTime = time;
      this.enemyFire();
    }

    // arrow rotation follow velocity + cleanup off-screen/settled arrows
    for (let i = this.arrows.length - 1; i >= 0; i--) {
      const arrow = this.arrows[i];
      if (!arrow.active) continue;
      const v = arrow.body.velocity;
      if (Math.hypot(v.x, v.y) > 0.02) arrow.rotation = Math.atan2(v.y, v.x);
      if (arrow.y > H + 100 || arrow.x < -50 || arrow.x > W + 50 || time - arrow.getData('spawnTime') > 6000) {
        this.destroyArrow(arrow);
      }
    }
  }

  enemyFire() {
    const targetX = this.player.zones.torso.position.x + Phaser.Math.Between(-6, 6);
    const targetY = this.player.zones.torso.position.y;
    const T = 0.85;
    const dx = targetX - ENEMY_X, dy = targetY - SHOT_ORIGIN.y;
    let vx = dx / T;
    let vy = (dy - 0.5 * GRAVITY_PX * T * T) / T;
    const speed = Math.hypot(vx, vy);
    let angle = Math.atan2(vy, vx);
    const errRad = Phaser.Math.DegToRad(this.enemyAimError);
    angle += Phaser.Math.FloatBetween(-errRad, errRad);
    vx = Math.cos(angle) * speed;
    vy = Math.sin(angle) * speed;
    this.spawnArrow(ENEMY_X, SHOT_ORIGIN.y, vx, vy, 'enemy');
    this.enemy.flashPose('attack', 400);
  }

  // Boss "awakening": a AWAKEN_CUTSCENE_MS-long beat where the boss holds
  // fire (the player can keep shooting for free hits) while a charging-up
  // visual plays, capped by a bigger "release" flash the instant it snaps
  // to full strength and resumes firing.
  awakenBoss() {
    this.awakened = true;
    this.awakening = true;

    const img = this.enemy.img;

    this.cameras.main.shake(220, 0.01);
    const flash1 = this.add.circle(img.x, img.y - img.displayHeight / 2, 10, 0xff5533, 0.85);
    this.tweens.add({ targets: flash1, radius: 100, alpha: 0, duration: 450, onComplete: () => flash1.destroy() });

    // regular font — this banner is centered near the right edge
    // (ENEMY_X), and pixel-font width could push it off-canvas
    const banner = this.add.text(ENEMY_X, img.y - img.displayHeight - 30, `${this.bossData.name.toUpperCase()} 각성 중...`, {
      fontFamily: 'Arial, sans-serif', fontSize: '28px', color: '#ff5533', fontStyle: 'bold',
    }).setOrigin(0.5).setScale(0.4).setAlpha(0);
    this.tweens.add({ targets: banner, alpha: 1, scale: 1, duration: 220, ease: 'Back.easeOut' });

    // sustained charging pulse across the whole cutscene window
    const baseScaleX = img.scaleX, baseScaleY = img.scaleY;
    const pulseCycles = Math.max(1, Math.round(AWAKEN_CUTSCENE_MS / 500) - 1);
    this.tweens.add({
      targets: img, scaleX: baseScaleX * 1.15, scaleY: baseScaleY * 1.15, duration: 250, yoyo: true,
      repeat: pulseCycles, ease: 'Sine.easeInOut',
      onComplete: () => { img.setScale(baseScaleX, baseScaleY); },
    });

    this.time.delayedCall(AWAKEN_CUTSCENE_MS, () => {
      this.awakening = false;
      this.enemyReload = this.bossData.reload;
      this.enemyAimError = this.bossData.aimError;
      this.lastEnemyShotTime = this.time.now; // fresh reload window, no instant cheap shot
      this.enemy.setIdleTexture(this.bossData.key + '_awakened'); // transform into the boss look now that it fights at full strength
      this.enemy.setPoseTexture('attack', this.bossData.key + '_attack_awakened'); // bow-draw art also reflects the awakened outfit from here on
      this.bg.setTexture('bg_bossarena'); // office → boss arena, same moment the boss transforms
      this.groundVisual.setFillStyle(0x2b2035, 0.5); // olive grass tone -> dark cracked-tile tone

      this.cameras.main.shake(300, 0.016);
      const flash2 = this.add.circle(img.x, img.y - img.displayHeight / 2, 10, 0xff2200, 0.9);
      this.tweens.add({ targets: flash2, radius: 140, alpha: 0, duration: 380, onComplete: () => flash2.destroy() });

      if (banner.active) {
        banner.setText(`${this.bossData.name.toUpperCase()} 각성!!`);
        this.tweens.add({ targets: banner, alpha: 0, y: banner.y - 30, duration: 450, onComplete: () => banner.destroy() });
      }
    });
  }
}

class ShopScene extends Phaser.Scene {
  constructor() { super('ShopScene'); }
  init(data) { this.comingStage = data.comingStage; }

  create() {
    this.add.rectangle(0, 0, W, H, 0x14181f).setOrigin(0);

    });
  }

  buildStatsPanel() {
    const x = 40, y = 90, w = 380, h = 560;
    this.add.rectangle(x, y, w, h, 0x1d232c, 0.9).setOrigin(0).setStrokeStyle(2, 0x33404f);
    this.add.text(x + 20, y + 16, '내 스탯', { fontFamily: 'Arial, sans-serif', fontSize: '22px', color: '#ffd166', fontStyle: 'bold' });

    const stats = computePlayerStats(SAVE);
    const lines = [
      `HP        ${fmt(stats.maxHp)}`,
      `ATK       x${stats.atk.toFixed(2)}`,
      `ATK SPD   ${Math.round(stats.atkspd * 100)}%`,
      `DEF       ${Math.round(stats.def * 100)}%`,
      `GOLD      ${fmt(SAVE.gold)}`,
    ];
    lines.forEach((l, i) => {
      this.add.text(x + 20, y + 64 + i * 32, l, { fontFamily: 'Consolas, monospace', fontSize: '18px', color: '#e6ecf2' });
    });

    this.add.text(x + 20, y + 240, '장착 중', { fontFamily: 'Arial, sans-serif', fontSize: '18px', color: '#9fd2ff' });
    const w1 = weaponById(SAVE.equippedWeapon), a1 = armorById(SAVE.equippedArmor);
    this.add.circle(x + 30, y + 280, 8, RARITY_COLOR[w1.rarity]);
    this.add.text(x + 46, y + 271, `🏹 ${w1.name}`, { fontFamily: 'Arial, sans-serif', fontSize: '16px', color: '#ffffff' });
    this.add.circle(x + 30, y + 312, 8, RARITY_COLOR[a1.rarity]);
    this.add.text(x + 46, y + 303, `🛡 ${a1.name}`, { fontFamily: 'Arial, sans-serif', fontSize: '16px', color: '#ffffff' });

    this.add.text(x + 20, y + h - 40, `보유 스테이지 진행: ${SAVE.clearedStages}/${STAGE_MAX}`, {
      fontFamily: 'Arial, sans-serif', fontSize: '14px', color: '#7d8794',
    });
  }

  buildShopPanel() {
    const x = 460, y = 90, w = 780, h = 560;
    this.add.rectangle(x, y, w, h, 0x1d232c, 0.9).setOrigin(0).setStrokeStyle(2, 0x33404f);
    this.add.text(x + 20, y + 16, '무기', { fontFamily: 'Arial, sans-serif', fontSize: '20px', color: '#ffd166', fontStyle: 'bold' });

    const cardW = 360, cardH = 100, gap = 12;
    WEAPONS.forEach((item, i) => {
      const cx = x + 20 + (i % 2) * (cardW + gap);
      const cy = y + 56 + Math.floor(i / 2) * (cardH + gap);
      this.buildItemCard(cx, cy, cardW, cardH, item, 'weapon');
    });

    const armorY = y + 56 + 2 * (cardH + gap) + 30;
    this.add.text(x + 20, armorY - 24, '방어구', { fontFamily: 'Arial, sans-serif', fontSize: '20px', color: '#ffd166', fontStyle: 'bold' });
    ARMORS.forEach((item, i) => {
      const cx = x + 20 + (i % 2) * (cardW + gap);
      const cy = armorY + Math.floor(i / 2) * (cardH + gap);
      this.buildItemCard(cx, cy, cardW, cardH, item, 'armor');
    });
  }

  buildItemCard(x, y, w, h, item, kind) {
    const isWeapon = kind === 'weapon';
    const owned = isWeapon ? SAVE.ownedWeapons.includes(item.id) : SAVE.ownedArmors.includes(item.id);
    const equipped = isWeapon ? SAVE.equippedWeapon === item.id : SAVE.equippedArmor === item.id;

    const bg = this.add.rectangle(x, y, w, h, 0x262e39).setOrigin(0).setStrokeStyle(equipped ? 3 : 1, equipped ? 0x4caf50 : 0x39424f);
    this.add.circle(x + 18, y + 20, 8, RARITY_COLOR[item.rarity]);
    this.add.text(x + 34, y + 10, item.name, { fontFamily: 'Arial, sans-serif', fontSize: '17px', color: '#ffffff', fontStyle: 'bold' });

    let effectText = '';
    if (isWeapon) {
      if (item.atk) effectText += `ATK +${item.atk} `;
      if (item.atkspd) effectText += `ATKSPD ${item.atkspd > 0 ? '+' : ''}${Math.round(item.atkspd * 100)}%`;
    } else {
      if (item.hp) effectText += `HP +${item.hp} `;
      if (item.def) effectText += `DEF +${Math.round(item.def * 100)}%`;
    }
    if (!effectText) effectText = '기본 장비';
    this.add.text(x + 34, y + 34, effectText, { fontFamily: 'Arial, sans-serif', fontSize: '14px', color: '#b7c2cf' });

    const btnLabel = equipped ? '장착됨' : (owned ? '장착' : `구매 (${item.price}G)`);
    const canAfford = owned || SAVE.gold >= item.price;
    const btn = makeButton(this, x + w - 78, y + h / 2 + 6, 130, 40, btnLabel, {
      bg: equipped ? 0x4caf50 : (owned ? 0x2d6cdf : 0x8a6d2f),
      fontSize: 14,
      enabled: !equipped && canAfford,
      onClick: () => {
        if (!owned) {
          SAVE.gold -= item.price;
          if (isWeapon) SAVE.ownedWeapons.push(item.id); else SAVE.ownedArmors.push(item.id);
        }
        if (isWeapon) SAVE.equippedWeapon = item.id; else SAVE.equippedArmor = item.id;
        persistSave();
        this.scene.restart({ comingStage: this.comingStage });
      },
    });
  }
}

/* ================= BOOT SCENE ================= */
// Loads every character texture once (base64, no network) before the menu
// shows, instead of re-loading per GameScene restart.
class BootScene extends Phaser.Scene {
  constructor() { super('BootScene'); }
  create() {
    // Phaser's file Loader can hang processing data-URI images in some
    // environments (observed: every file stuck at FILE_LOADING even though
    // a plain `new Image()` decodes the same data URI instantly) — so
    // textures are loaded directly via plain Image + TextureManager.addImage
    // instead of this.load.image(), sidestepping the loader queue entirely.
    const keys = Object.keys(TEXTURES);
    let remaining = keys.length + 1; // +1 for the pixel font below
    const finish = () => { if (--remaining <= 0) this.scene.start('MenuScene'); };
    keys.forEach((key) => {
      const img = new Image();
      img.onload = () => { this.textures.addImage(key, img); finish(); };
      img.onerror = () => { console.error('texture load failed:', key); finish(); };
      img.src = TEXTURES[key];
    });

    // Canvas text only picks up a web font if it has actually finished
    // loading by the time fillText() runs, so wait for it here rather than
    // risk every Text object's first paint silently falling back.
    document.fonts.load('16px "Press Start 2P"').then(finish, finish);
  }
}

/* ================= GAME BOOT ================= */
const config = {
  type: Phaser.AUTO,
  width: W,
  height: H,
  parent: 'game-container',
  backgroundColor: '#0b0d10',
  disableContextMenu: true,
  scale: { mode: Phaser.Scale.FIT, autoCenter: Phaser.Scale.CENTER_BOTH },
  dom: { createContainer: true },
  physics: {
    default: 'matter',
    matter: { gravity: { y: 1 }, debug: false },
  },
  scene: [BootScene, MenuScene, GameScene, ShopScene, ResultScene],
};

window.addEventListener('load', () => {
  new Phaser.Game(config);
});
</script>
